<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLibras - Exercício de Soletração</title>

<link rel="stylesheet" href="https://unpkg.com/papercss@1.9.2/dist/paper.min.css">
<script type="module" src="https://unpkg.com/wired-elements?module"></script>

<style>
    /* CONFIGURAÇÃO GERAL */
    body {
        /* Cor de fundo base */
        background-color: #f8f9fa; 
        
        /* O Desenho das bolinhas */
        background-image: radial-gradient(#bdc3c7 1.5px, transparent 1.5px);
        
        /* O espaçamento entre as bolinhas */
        background-size: 20px 20px;
        
        font-family: 'Neucha', cursive;
        overflow-x: hidden;
        margin: 0;
    }

    .main-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    /* CABEÇALHO */
    header {
        margin-bottom: 30px;
        text-align: center;
    }
    
    header h1 {
        display: inline-flex;
        align-items: center;
        gap: 15px;
        color: #41403e;
        border: none; 
        padding-bottom: 10px;
    }

    header img {
        height: 60px;
        width: auto;
    }

    /* LAYOUT PRINCIPAL */
    .app-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 3rem;
        justify-content: center;
        align-items: flex-start;
    }

    /* CÂMERA */
    .cam-area {
        flex: 2;
        min-width: 300px;
        max-width: 680px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .video-frame {
        position: relative;
        background: #fff;
        padding: 10px;
        
        /* Borda irregular para parecer desenhado a mão */
        border: 3px solid #41403e;
        border-radius: 2% 95% 1% 96% / 95% 2% 92% 5%; 
        box-shadow: 10px 15px 0px rgba(0,0,0,0.1); 
        
        width: 100%;
        box-sizing: border-box;
    }

    video {
        width: 100%;
        height: auto;
        display: block;
        transform: scaleX(-1); /* Espelhar */
        border-radius: 4px;
        background: #eee; 
    }

    .status-text, #status {
        display: none !important;
    }

    /* PAINEL DE CONTROLE */
    .control-panel {
        flex: 1;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    /* Card de Exercício */
    .exercise-card {
        background: #fff;
        padding: 25px;
        /* Borda "rabiscada" via CSS radius */
        border: 2px solid #41403e;
        border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
        /* Sombra interna suave */
        box-shadow: 
            2px 3px 20px rgba(0,0,0,0.1), 
            0 0 60px rgba(255, 240, 200, 0.2) inset;
        min-height: 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
    }

    .instruction {
        font-size: 1.6rem;
        color: #41403e;
        margin-bottom: 20px;
        text-align: center;
        font-weight: bold;
        line-height: 1.2;
    }

    /* LETRAS */
    .letters-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 20px 0;
    }

    .letter-box {
        width: 60px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
        color: #41403e;
        background: #fff;
        border: 3px solid #41403e;
        border-radius: 5px 20px 5px 20px; /* Formato irregular */
        transition: transform 0.2s;
    }

    .letter-box.active {
        border-color: #0071de;
        color: #0071de;
        transform: scale(1.15) rotate(-3deg);
        box-shadow: 4px 4px 0px rgba(0,113,222, 0.2);
    }

    .letter-box.success {
        border-color: #2e7d32;
        background-color: #c8e6c9;
        color: #1b5e20;
        transform: rotate(2deg);
    }

    /* ÁREA DE PREDIÇÃO */
    .prediction-area {
        text-align: center;
        margin-top: 15px;
        border-top: 2px dashed #ccc;
        padding-top: 15px;
        width: 100%;
    }

    .prediction-label {
        font-size: 1rem;
        color: #888;
        margin-bottom: 5px;
    }

    .prediction {
        font-size: 2.2rem;
        color: #d63384; 
        font-weight: bold;
        min-height: 50px;
    }

    /* BOTÕES */
    .actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
    }

    wired-button {
        width: auto !important;
        min-width: 200px; 
        font-size: 1.3rem;
        color: #333;
        font-weight: bold;
        background: transparent !important;
    }

    /* Cor interna do botão */
    wired-button.primary {
        --wired-button-bg-color: #2ba2da; 
    }

    /* Botão de Próxima Palavra */
    wired-button#next-word-btn {
        --wired-button-bg-color: #bbf7d0;
        display: none;
    }

    /* OVERLAY DA MÃO */
    .video-container {
        position: relative;
    }

    .hand-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0.4;
        pointer-events: none;
        display: none;
        transform: scaleX(-1); 
        z-index: 10;
    }

    /* Botão de ajuda pequeno no canto do vídeo */
    .help-wrapper {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 20;
    }
    
    wired-icon-button {
        background: white;
        color: #41403e;
        --wired-icon-size: 24px;
    }

    /* RODAPÉ */
    footer {
        margin-top: 60px;
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-bottom: 20px;
    }

    footer img {
        height: 50px;
        border: none !important;
        box-shadow: none !important;
        background: transparent;
        transition: transform 0.3s;
    }
    
    footer img:hover {
        transform: scale(1.1);
    }
</style>
</head>
<body>

<div class="main-container">
    
    <header>
        <h1>
            <img src="/static/logo.png" alt="Logo" onerror="this.style.display='none'"> 
            <span>AlphaLibras</span>
        </h1>
        <p style="font-size: 1.2rem;">Ensino de Libras Interativo</p>
    </header>

    <main class="app-grid">
        
        <div class="cam-area">
            <div class="video-frame video-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas" width="640" height="480" style="display:none"></canvas>
                
                <img id="hand-overlay" class="hand-overlay" src="" alt="Ajuda Libras">

                <div class="help-wrapper">
                    <wired-button id="btn-help" style="min-width: 40px; padding: 5px; font-weight:bold;">
                        ?
                    </wired-button>
                </div>
            </div>
            
            <div class="status-text" id="status">Status: Aguardando câmera...</div>
        </div>

        <div class="control-panel">
            
            <div class="exercise-card">
                <div class="instruction" id="instruction">Clique em "Iniciar" para começar</div>
                
                <div class="letters-row" id="letters-row">
                    <div class="letter-box">?</div>
                </div>

                <div class="prediction-area">
                    <div class="prediction-label">Sua mão está fazendo:</div>
                    <div class="prediction" id="predicted-letter">-</div>
                </div>
            </div>

            <div class="actions">
                <wired-button elevation="3" class="primary" id="start-button">
                    INICIAR EXERCÍCIO
                </wired-button>
                
                <wired-button elevation="3" id="next-word-btn">
                    Próxima Palavra &rarr;
                </wired-button>
            </div>

        </div>
    </main>

    <footer>
        <img src="/static/brasao3_horizontal_cor_300dpi.png" alt="UFC">
        <img src="/static/logo-nuclic.png" alt="Nuclic">
    </footer>
</div>

<script>
// CONFIGURAÇÃO
const isHttps = window.location.protocol === 'https:';
const wsProtocol = isHttps ? 'wss://' : 'ws://';
const host = window.location.host; 
const wsUrl = `${wsProtocol}${host}/api/v1/classify/ws`;
const wordUrl = `${window.location.origin}/api/v1/exercicios/soletracao`;

let currentWord = "";
let letters = [];
let currentIndex = 0;
let isLetterSolved = false;
let ws = null;
let frameInterval = null;

// ELEMENTOS DO DOM
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const instructionEl = document.getElementById("instruction");
const lettersRow = document.getElementById("letters-row");
const predictedLetterEl = document.getElementById("predicted-letter");
const startButton = document.getElementById("start-button");
const nextWordBtn = document.getElementById("next-word-btn");
const statusEl = document.getElementById("status");

// Novos elementos para Ajuda
const handOverlay = document.getElementById("hand-overlay");
const btnHelp = document.getElementById("btn-help");
let isHelpVisible = false;

// FUNÇÕES DE AJUDA

// Atualiza a imagem com base na letra atual
function updateOverlayImage() {
    const letter = letters[currentIndex];
    if (!letter) return;
    
    handOverlay.src = `/static/maos/${letter.toLowerCase()}.png`;
}

// Liga/Desliga a visualização da ajuda
function toggleHelp() {
    isHelpVisible = !isHelpVisible;
    if (isHelpVisible) {
        handOverlay.style.display = "block";
        btnHelp.textContent = "X";
    } else {
        handOverlay.style.display = "none";
        btnHelp.textContent = "?";
    }
}

// Ouvinte do botão de ajuda
btnHelp.addEventListener("click", toggleHelp);


// LÓGICA DO JOGO E CÂMERA

async function startCamera() {
    try {
        statusEl.textContent = "Solicitando câmera...";
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play();
            statusEl.textContent = "Câmera ativa";
        };
    } catch (err) {
        console.error("Erro Câmera:", err);
        statusEl.textContent = "Erro: Câmera bloqueada.";
        instructionEl.textContent = "Permita o uso da câmera.";
    }
}

function renderLetters(word) {
    lettersRow.innerHTML = "";
    letters = Array.from(word);
    letters.forEach((l, i) => {
        const box = document.createElement("div");
        box.className = "letter-box";
        box.dataset.index = i;
        box.textContent = l;
        lettersRow.appendChild(box);
    });
    highlightCurrent();
}

function highlightCurrent() {
    document.querySelectorAll(".letter-box").forEach(el => el.classList.remove("active"));
    const cur = document.querySelector(`.letter-box[data-index="${currentIndex}"]`);
    if (cur) cur.classList.add("active");
}

function markSuccess(index) {
    const el = document.querySelector(`.letter-box[data-index="${index}"]`);
    if (el) {
        el.classList.remove("active");
        el.classList.add("success");
    }
}

function nextLetter() {
    currentIndex++;
    isLetterSolved = false;
    
    // Seleciona a label para alterar o texto
    const labelEl = document.querySelector(".prediction-label");

    if (currentIndex >= letters.length) {
        instructionEl.textContent = `Parabéns! "${currentWord}" concluída.`;
        predictedLetterEl.textContent = "🎉";
        
        // Troca a mensagem "Sua mão..." por instrução de avançar
        if(labelEl) labelEl.textContent = "Clique abaixo para continuar:";
        
        nextWordBtn.style.display = "inline-block";
        
        // Garante que a ajuda suma no final
        handOverlay.style.display = "none";
        isHelpVisible = false;
        btnHelp.textContent = "?";
        
        stopWS();
        return;
    }
    
    highlightCurrent();
    instructionEl.textContent = `Faça o sinal da letra "${letters[currentIndex]}"`;
    
    // RESET DA AJUDA (Esconde a ajuda ao passar para a próxima letra)
    isHelpVisible = false; 
    handOverlay.style.display = "none";
    btnHelp.textContent = "?";
    
    // Atualiza a imagem
    updateOverlayImage();
}

function stopWS() {
    if (ws) {
        ws.onclose = null; 
        ws.close();
        ws = null;
    }
    clearInterval(frameInterval);
}

function handlePrediction(predLetter, confidence) {
    if (!predLetter) {
        predictedLetterEl.textContent = "...";
        return;
    }
    
    predictedLetterEl.textContent = predLetter;

    const target = letters[currentIndex];
    if (!target || isLetterSolved) return;

    if (predLetter.toUpperCase() === target.toUpperCase()) {
        isLetterSolved = true;
        markSuccess(currentIndex);
        predictedLetterEl.textContent = `${predLetter} (Correto!)`;
        predictedLetterEl.style.color = "#2e7d32"; 
        
        setTimeout(() => {
            predictedLetterEl.style.color = "#d63384"; 
            nextLetter();
        }, 800);
    }
}

function connectWS() {
    if (ws) ws.close();
    clearInterval(frameInterval);

    try {
        ws = new WebSocket(wsUrl);
        
        ws.onopen = () => {
            frameInterval = setInterval(sendFrame, 200); 
        };
        
        ws.onmessage = e => {
            try {
                const data = JSON.parse(e.data);
                handlePrediction(data.letra, data.confianca);
            } catch (err) {}
        };

        ws.onclose = () => clearInterval(frameInterval);
        ws.onerror = () => clearInterval(frameInterval);
    } catch (e) {
        console.error("Erro WebSocket", e);
    }
}

function sendFrame() {
    // Evita erro no backend checando conexão
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (video.readyState < 2) return; 

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const frame = canvas.toDataURL("image/jpeg", 0.5); 
    ws.send(frame);
}

window.onbeforeunload = function() {
    stopWS();
};

async function fetchNewWord() {
    instructionEl.textContent = "Sorteando...";
    startButton.style.opacity = "0.5";
    nextWordBtn.style.display = "none";
    predictedLetterEl.textContent = "-";

    // Restaura o texto original da label ao iniciar novo jogo
    const labelEl = document.querySelector(".prediction-label");
    if(labelEl) labelEl.textContent = "Sua mão está fazendo:";
    
    try {
        const response = await fetch(wordUrl);
        if (!response.ok) throw new Error("API Error");
        
        const data = await response.json();
        currentWord = data.palavra.toUpperCase();
        
        currentIndex = 0;
        isLetterSolved = false;
        renderLetters(currentWord);
        instructionEl.textContent = `Faça o sinal da letra "${letters[0]}"`;
        
        isHelpVisible = false;
        handOverlay.style.display = "none";
        btnHelp.textContent = "?";
        
        updateOverlayImage();
        connectWS();

    } catch (error) {
        console.error(error);
        instructionEl.textContent = "Modo Teste (LIBRAS)";
        currentWord = "LIBRAS";
        renderLetters(currentWord);
        updateOverlayImage();
        connectWS();
    } finally {
        startButton.style.opacity = "1";
        startButton.textContent = "REINICIAR";
    }
}

startButton.addEventListener("click", fetchNewWord);
nextWordBtn.addEventListener("click", fetchNewWord);

startCamera();

</script>
</body>
</html>
